<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <!-- Python glyph subtle accents -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#2a75e8"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#f29900"/>
    </linearGradient>
  </defs>

  <!-- Clean stylized brand text inspired by Google Product Sans geometry -->
  <!-- "Python" in 4 signature colors -->
  <g font-family="system-ui, -apple-system, 'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="54" letter-spacing="-1.5">
    <text x="12" y="68" fill="#4285F4">P</text>
    <text x="44" y="68" fill="#EA4335">y</text>
    <text x="73" y="68" fill="#FBBC05">t</text>
    <text x="94" y="68" fill="#4285F4">h</text>
    <text x="126" y="68" fill="#34A853">o</text>
    <text x="157" y="68" fill="#EA4335">n</text>
  </g>

  <!-- "Hub" badge in clean slate gray -->
  <g font-family="system-ui, -apple-system, 'Google Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="28" letter-spacing="-0.5">
    <rect x="200" y="38" width="70" height="34" rx="17" fill="#f1f3f4"/>
    <text x="215" y="63" fill="#5f6368">Hub</text>
  </g>

  <!-- Minimal decorative accent dot / offline indicator -->
  <circle cx="288" cy="46" r="4.5" fill="#34A853"/>
</svg>
