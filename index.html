<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline-first Python practical search hub and direct resource repository">
  <meta name="theme-color" content="#ffffff">
  <title>AI Practical Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>
  <!-- Header Bar -->
  <header class="top-nav">
    <div class="top-nav-left">
      <span class="badge" id="networkStatusBadge">
        <span class="status-dot"></span>
        <span id="networkStatusText">Ready</span>
      </span>
    </div>
    <div class="top-nav-right">
      <a href="#about" id="aboutLink" class="nav-link">About</a>
      <a href="#practicals" id="practicalsLink" class="nav-link">8 Practicals</a>
      <div class="app-icon" title="Practical Hub Services" aria-label="Apps menu">
        <svg focusable="false" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#5f6368" d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"></path>
        </svg>
      </div>
    </div>
  </header>

  <!-- Central Search Container -->
  <main class="main-content">
    <div class="logo-wrapper">
      <img src="assets/logo.svg" alt="Python Hub Logo" class="brand-logo" width="300" height="88">
    </div>

    <!-- Search Form / Input Area -->
    <div class="search-box-container">
      <div class="search-box" id="searchBox">
        <div class="search-icon-wrapper" aria-hidden="true">
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </div>

        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search Python practicals or topics..." 
          autocomplete="off" 
          spellcheck="false" 
          aria-label="Search Python practicals">

        <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search" title="Clear">
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#70757a" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>

        <div class="search-tool-icon" title="Python Code Practicals">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
          </svg>
        </div>
      </div>

      <!-- Live Search Suggestions / Result Preview Dropdown -->
      <div class="suggestions-list" id="suggestionsList" role="listbox" aria-label="Search suggestions"></div>
    </div>

    <!-- Google-Inspired Buttons -->
    <div class="search-buttons">
      <button type="button" class="btn" id="googleSearchBtn">Google Search</button>
      <button type="button" class="btn btn-action" id="tryAgainBtn" title="Download the original Python practicals ZIP package">Try Again</button>
    </div>

    <div class="subtext">
      <span>AI Practical Repository: <strong>8 Experiments (.ipynb)</strong></span>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- Info Modal for About & Practicals list -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content" id="modalContent">
      <div class="modal-header">
        <h3 id="modalTitle">About Python Practical Hub</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Injected dynamically via script.js -->
      </div>
    </div>
  </div>

  <!-- Google-Style Footer -->
  <footer class="footer">
    <div class="footer-row footer-row-top">
      <span class="location">Offline Local Hub</span>
      <span class="location-sep">•</span>
      <span class="location-detail">Self-Contained Browser Storage</span>
    </div>
    <div class="footer-row footer-row-bottom">
      <div class="footer-links-left">
        <a href="#about" class="footer-link modal-trigger" data-target="about">About</a>
        <a href="#how" class="footer-link modal-trigger" data-target="how">How it Works</a>
        <a href="#offline" class="footer-link modal-trigger" data-target="offline">Offline Cache</a>
      </div>
      <div class="footer-links-right">
        <a href="#practicals" class="footer-link modal-trigger" data-target="practicals">List Practicals</a>
        <a href="#download" class="footer-link" id="footerDownloadLink">Download ZIP</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
